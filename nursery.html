<h3>About the App (WebView Container)</h3>
<p>Nursery App is a <b>WebView container</b>: it displays web content inside the app. The page it opens is set by us through a link stored in Firebase, so we can update the learning content without releasing a new version. If no link is set, the app opens the built-in learning content that ships with the app. Because the app loads this content from the internet, an internet connection may be used while the app opens. We choose the content that is loaded and do not knowingly load pages that collect personal information from children.</p>
<h3>Firebase Services</h3>
<p>We use Google <b>Firebase</b> services: <b>Firebase Realtime Database</b> (to read the link of the content to display) and <b>Firebase Analytics</b>. Firebase may automatically collect limited technical and usage data such as app launches, app version, device model, operating system version, language, approximate region (from IP address), crash and diagnostic reports, and an app-instance identifier. This data is used only to keep the app working, fix problems and understand overall usage. It is not used for advertising, profiling or personalised content. Firebase is operated by Google; see <a href="https://firebase.google.com/support/privacy">firebase.google.com/support/privacy</a> and <a href="https://policies.google.com/privacy">policies.google.com/privacy</a>.</p>
<h3>Personal Information</h3>
<p>The app has no sign-up or login and does not ask for a name, email, phone number, photo, location, contacts or any other personal detail. <b>No personal information is collected from children without verifiable parental consent.</b> We do not sell, rent, share or transfer children’s personal information. Your language choice (English or Hindi) and the last opened link are stored only on your device.</p>

<p>The app speaks words using the text-to-speech engine installed on your device. We do not record or store any audio or voice.</p>

function show(v){cur=v;if(S)S.cancel();$('ttl').textContent=v=='home'?CFG.title:(HI&&TT[v]||v);$('lg').textContent=HI?'EN':'हिं';M.scrollTop=0;
 if(v=='home')return grid(HOME.map(([n,h,e])=>{const c=card(e,n,h,null,e.length>3?'s':'');c.onclick=()=>{beep(800);go(n)};return c}));
 if(v=='Numbers')return grid(W.slice(1).map((w,i)=>card(`<b style="color:#c00;font-size:22vw">${i+1}</b>`,w,H[i+1],sp(`${i+1}. ${w}`,H[i+1]))));
 if(v=='Alphabets')return grid(AL.split(';').map(s=>{const[a,w,h,e]=s.split('|');return card(`<b>${a}</b>${e}`,w,h,HI?[[`${a} for ${w}`,'en-US'],[h,'hi-IN']]:EN(`${a} for ${w}`))}));
 if(v=='Hindi Varnmala')return grid(VM.split(';').map(s=>{const[a,w,t,e]=s.split('|');return card(`<b>${a}</b>${e}`,w,t,HN(`${a} से ${w}`))}));
 if(v=='Colors')return grid(items(v).map(([e,h,c])=>card(`<div class="sw" style="background:${c}"></div>`,e,h,sp(e,h))));
 if(L[v])return grid(items(v).map(([e,h,p])=>card(p,e,h,sp(e,h),p.length>6?'s':'')));
 if(v=='Days'){M.innerHTML='<div class="pill">'+(HI?'दिन':'Days')+'</div>';DAYS.forEach((s,i)=>{const[e,h]=s.split(' ');row(HI?h:e,COL[i],null,sp(e,h))});return}
 if(v=='Month'){M.innerHTML='<div class="pill">'+(HI?'महीने':'Months')+'</div>';MON.forEach((s,i)=>{const[e,h,d]=s.split(' ');row(HI?h:e,COL[i%COL.length],d,sp(`${e} has ${d} days`,`${h} में ${d} दिन होते हैं`))});return}
 if(v=='Multiplication Numbers')return table(1);
 if(v=='Drawing')return draw();
 if(v=='Test')return levels();
 if(v=='Privacy Policy'){M.innerHTML='<div class="pol">'+POLICY+'</div>'}}
function row(t,c,n,segs){const r=document.createElement('div');r.className='row';r.style.background=c;r.innerHTML=`<span style="flex:1">${t}</span>`+(n?`<b>${n}</b>`:'');r.onclick=()=>{pop(r);say(segs)};M.appendChild(r)}
function table(n){n=Math.max(1,Math.min(20,n));M.innerHTML=`<div style="text-align:center"><button class="btn" onclick="table(1)">RESET</button><button class="btn" onclick="table(${n-1})">-</button><button class="btn" style="background:#2e9e3e" onclick="table(${n+1})">+</button></div><div class="pill" style="color:red;width:40%">${n}</div><div class="sheet"></div>`;
 const s=M.querySelector('.sheet');for(let i=1;i<=10;i++){const d=document.createElement('div');d.textContent=`${n} x ${i} = ${n*i}`;d.onclick=()=>{pop(d);say(sp(`${n} times ${i} is ${n*i}`,`${n} गुणा ${i} बराबर ${n*i}`))};s.appendChild(d)}}
function draw(){M.innerHTML='<div id="pal"></div><canvas id="cv"></canvas><div style="text-align:center"><button class="btn" id="clr">Clear</button></div>';
 const cv=$('cv'),c=cv.getContext('2d');cv.width=cv.offsetWidth;cv.height=Math.round(innerHeight*.55);cv.style.height=cv.height+'px';
 let col='#f00',dn=0;[["#f00","Red","लाल"],["#00f","Blue","नीला"],["#0a0","Green","हरा"],["#ff0","Yellow","पीला"],["#ffa500","Orange","नारंगी"],["#800080","Purple","बैंगनी"],["#ff69b4","Pink","गुलाबी"],["#8b4513","Brown","भूरा"],["#000","Black","काला"]].forEach(([k,e,h])=>{const d=document.createElement('span');d.className='dot';d.style.background=k;d.onclick=()=>{col=k;say(sp(e,h))};$('pal').appendChild(d)});
 const p=e=>{const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top]};
 const st=e=>{dn=1;const[x,y]=p(e);c.beginPath();c.moveTo(x,y);e.preventDefault()},mv=e=>{if(!dn)return;const[x,y]=p(e);c.strokeStyle=col;c.lineWidth=8;c.lineCap='round';c.lineTo(x,y);c.stroke();e.preventDefault()};
 cv.ontouchstart=st;cv.ontouchmove=mv;cv.ontouchend=()=>dn=0;cv.onmousedown=st;cv.onmousemove=mv;cv.onmouseup=()=>dn=0;
 $('clr').onclick=()=>{c.clearRect(0,0,cv.width,cv.height);beep()}}

// ===== TEST: Easy / Medium / Hard =====
function levels(){M.innerHTML=`<div class="pill" style="width:90%">${HI?'स्तर चुनें':'Choose Level'}</div>`;
 [["Easy","आसान","#2e9e3e","⭐"],["Medium","मध्यम","#f9a825","⭐⭐"],["Hard","कठिन","#e53935","⭐⭐⭐"]].forEach(([e,h,c,s],i)=>{const b=document.createElement('button');b.className='opt';b.style.cssText='background:'+c+';padding:26px;margin:18px 0';b.innerHTML=`${s}<br>${HI?h:e}`;b.onclick=()=>{beep(800);quiz(i)};M.appendChild(b)})}
const R=n=>Math.floor(Math.random()*n);
function mk(lv){const t=R(3),O={'+':['plus','जमा'],'-':['minus','घटा'],'x':['times','गुणा']};let x,y,o='+',a,pic,qs,say_;
 const eq=()=>{pic=`${x} ${o} ${y} = ?`;a=o=='+'?x+y:o=='-'?x-y:x*y;say_=sp(`${x} ${O[o][0]} ${y}?`,`${x} ${O[o][1]} ${y} कितना होगा?`)};
 if(t==2||(lv==0&&t==1&&false)){const P=["Fruits","Vegetables","Animals","Birds","Vehicles","Sea Animals"].flatMap(k=>items(k)),it=P[R(P.length)];
  pic=`<span style="font-size:90px">${it[2]}</span>`;a=it[HI?1:0];say_=sp('What is this?','यह क्या है?');
  const ops=[a];while(ops.length<4){const n=P[R(P.length)][HI?1:0];if(!ops.includes(n))ops.push(n)}return{pic,a,ops:ops.sort(()=>Math.random()-.5),say:say_}}
 if(lv==0){if(t==0){const n=1+R(9),e=["🍎","⭐","🐥","🎈","🚗"][R(5)];pic=`<span style="font-size:34px;word-break:break-all">${e.repeat(n)}</span>`;a=n;say_=sp('Count them','गिनिए कितने हैं?')}else{x=1+R(5);y=1+R(5);eq()}}
 else if(lv==1){if(t==0){x=5+R(8);y=1+R(8);eq()}else{o='-';x=10+R(11);y=1+R(9);eq()}}
 else{if(t==0){o='x';x=2+R(9);y=2+R(9);eq()}else if(R(2)){x=10+R(21);y=10+R(21);eq()}else{o='-';x=20+R(31);y=5+R(15);eq()}}
 const ops=[a];while(ops.length<4){const n=a+R(9)-4;if(n>=0&&!ops.includes(n))ops.push(n)}return{pic,a,ops:ops.sort(()=>Math.random()-.5),say:say_}}
function quiz(lv){let q=0,sc=0;const C=["#e53935","#3f51b5","#2e9e3e","#8e24aa"];
 function next(){if(q==10){M.innerHTML=`<div class="pill" style="width:90%">${HI?'अंक':'Score'} ${sc}/10</div><div style="text-align:center;font-size:90px">${sc>=7?'🏆':'👍'}</div><div style="text-align:center"><button class="btn" id="ag">${HI?'फिर खेलें':'Play Again'}</button><button class="btn" style="background:#3f51b5" id="lv">${HI?'स्तर बदलें':'Change Level'}</button></div>`;say(sp(`Your score is ${sc} out of 10`,`आपके 10 में से ${sc} अंक हैं`));$('ag').onclick=()=>{q=0;sc=0;next()};$('lv').onclick=levels;return}
  q++;const z=mk(lv);M.innerHTML=`<div class="pill" style="background:#a0f;color:#fff;width:100%;font-size:18px">${['Easy','Medium','Hard'][lv]} · ${HI?'सवाल':'Question'} ${q}/10</div><div class="pill" style="background:#555;color:#fff;width:100%;font-size:44px;min-height:110px;display:flex;align-items:center;justify-content:center">${z.pic}</div>`;
  z.ops.forEach((x,i)=>{const b=document.createElement('button');b.className='opt';b.style.background=C[i];b.textContent=x;b.onclick=()=>{if(x==z.a){sc++;say(sp('Correct! Well done','सही! शाबाश'))}else say(sp('Oops! Answer is '+z.a,'ग़लत! सही जवाब '+z.a+' है'));setTimeout(next,1500)};M.appendChild(b)});say(z.say)}
 next()}

// ===== DRAWER / MENU =====
function drawer(o){$('dr').classList.toggle('o',o);$('ov').style.display=o?'block':'none'}
function toggleLang(){HI=!HI;try{localStorage.setItem('lang',HI?'hi':'en')}catch(e){}$('dl').textContent=HI?'हिंदी':'English';beep(900);show(cur)}
function menu(k){drawer(0);const open=u=>window.open(u,'_blank');
 if(k=='home')go('home');if(k=='lang')toggleLang();if(k=='update'||k=='rate')open(CFG.playLink);if(k=='other')open(CFG.devLink);if(k=='privacy')go('Privacy Policy');
 if(k=='share'){const t=CFG.title+' - Kids Learning: '+CFG.playLink;navigator.share?navigator.share({text:t}):prompt('Copy & share:',t)}}
$('dl').textContent=HI?'हिंदी':'English';
initHash();
</script></body></html>
